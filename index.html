<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
}

#photo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<img id="photo" src="fotos/16%20copy.jpg" alt="">

<script>

const photos = [
    "fotos/16%20copy.jpg",
    "fotos/18%20copy.jpg",
    "fotos/3%20copy.jpg",
    "fotos/5%20copy.jpg",
    "fotos/8%20copy.jpg",
    "fotos/9%20copy.jpg"
];

let current = -1;

function showPhoto() {

    let next;

    do {
        next = Math.floor(Math.random() * photos.length);
    } while (photos.length > 1 && next === current);

    current = next;

    document.getElementById("photo").src = photos[current];
}

showPhoto();

setInterval(showPhoto, 2000);

</script>

</body>
</html>
