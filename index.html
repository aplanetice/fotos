<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
}

#photo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<img id="photo" alt="">

<script>
const photo = document.getElementById("photo");

const folderURL =
    "https://api.github.com/repos/aplanetice/fotos/contents/fotos";

let photos = [];
let current = -1;

async function loadPhotos() {

    const response = await fetch(folderURL);
    const files = await response.json();

    photos = files
        .filter(file => /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name))
        .map(file => file.download_url);

    showRandomPhoto();
}

function showRandomPhoto() {

    if (photos.length === 0) return;

    let next;

    do {
        next = Math.floor(Math.random() * photos.length);
    } while (photos.length > 1 && next === current);

    current = next;

    photo.src = photos[current];
}

loadPhotos();

setInterval(showRandomPhoto, 2000);
</script>

</body>
</html>
