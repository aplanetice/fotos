<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
}

#photo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<img id="photo" alt="">

<script>
let photos = [];
let current = -1;

async function loadPhotos() {
    const response = await fetch("photos.json");
    photos = await response.json();

    if (photos.length > 0) {
        showRandomPhoto();
        setInterval(showRandomPhoto, 2000);
    }
}

function showRandomPhoto() {
    let next;

    do {
        next = Math.floor(Math.random() * photos.length);
    } while (photos.length > 1 && next === current);

    current = next;
    document.getElementById("photo").src = photos[current];
}

loadPhotos();
</script>

</body>
</html>
