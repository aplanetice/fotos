<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
}

#photo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<img id="photo" alt="">

<script>

const photo = document.getElementById("photo");

const apiURL =
    "https://api.github.com/repos/aplanetice/fotos/contents/fotos";

let photos = [];
let current = -1;

async function loadPhotos() {

    const response = await fetch(apiURL);

    if (!response.ok) {
        throw new Error("No se pudieron cargar las fotos");
    }

    const files = await response.json();

    photos = files
        .filter(file =>
            file.type === "file" &&
            /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
        )
        .map(file =>
            "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/" +
            encodeURIComponent(file.name)
        );

    if (photos.length > 0) {
        showRandomPhoto();
        setInterval(showRandomPhoto, 2000);
    }
}

function showRandomPhoto() {

    let next;

    do {
        next = Math.floor(Math.random() * photos.length);
    } while (
        photos.length > 1 &&
        next === current
    );

    current = next;

    photo.src = photos[current];
}

loadPhotos();

</script>

</body>
</html>
