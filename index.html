<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: white;
  overflow: hidden;
}

img {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  display: block;
  transition: opacity 1s ease;
  opacity: 1;
}
</style>
</head>

<body>

<img id="photo">

<script>
const photos = [
  "16%20copy.jpg",
  "18%20copy.jpg",
  "3%20copy.jpg",
  "5%20copy.jpg",
  "8%20copy.jpg",
  "9%20copy.jpg"
];

let current = -1;
const photo = document.getElementById("photo");

function nextPhoto() {

  let next;

  do {
    next = Math.floor(Math.random() * photos.length);
  } while (photos.length > 1 && next === current);

  current = next;

  photo.style.opacity = 0;

  setTimeout(function() {
    photo.src = photos[current];
    photo.style.opacity = 1;
  }, 1000);
}

nextPhoto();

setInterval(nextPhoto, 5000);

photo.onclick = nextPhoto;
</script>

</body>
</html>
