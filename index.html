<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotos</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

#photo {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  display: block;
  transition: opacity 1s ease;
}

.fade {
  opacity: 0;
}
</style>
</head>

<body>

<img id="photo" src="" alt="">

<script>
const photos = [
  "fotos/01.jpg",
  "fotos/02.jpg",
  "fotos/03.jpg",
  "fotos/04.jpg",
  "fotos/05.jpg"
];

const photo = document.getElementById("photo");
let previous = -1;

function showRandomPhoto() {
  let next;

  do {
    next = Math.floor(Math.random() * photos.length);
  } while (photos.length > 1 && next === previous);

  previous = next;

  photo.classList.add("fade");

  setTimeout(() => {
    photo.src = photos[next];

    photo.onload = () => {
      photo.classList.remove("fade");
    };
  }, 1000);
}

showRandomPhoto();
setInterval(showRandomPhoto, 5000);
</script>

</body>
</html>
