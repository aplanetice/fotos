<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: hidden;
}

#photo {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
}
</style>
</head>

<body>

<img id="photo" alt="">

<script>
const photos = [
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/16%20copy.jpg",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/53CE97CF-D94D-4427-B855-684A1A6D1C0C.jpg",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_1287.jpeg",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_4656.JPG",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_6834.JPG",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_6838.JPG",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_8247.jpeg",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_8252.jpeg",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_8256.jpeg",
    "https://raw.githubusercontent.com/aplanetice/fotos/main/fotos/IMG_9059.JPG"
];

let current = -1;

function showPhoto() {
    let next;

    do {
        next = Math.floor(Math.random() * photos.length);
    } while (photos.length > 1 && next === current);

    current = next;
    document.getElementById("photo").src = photos[current];
}

showPhoto();
setInterval(showPhoto, 2000);
</script>

</body>
</html>
