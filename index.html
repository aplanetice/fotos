<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: white;
  overflow: hidden;
}

#photo {
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  display: block;
  opacity: 0;
  transition: opacity 1s ease;
  cursor: pointer;
}

#photo.visible {
  opacity: 1;
}
</style>
</head>

<body>

<img id="photo" alt="">

<script>
const photo = document.getElementById("photo");

const apiURL =
  "https://api.github.com/repos/aplanetice/fotos/contents/";

let photos = [];
let previous = -1;

async function loadPhotos() {
  const response = await fetch(apiURL);
  const files = await response.json();

  photos = files
    .filter(file => /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name))
    .map(file => file.download_url);

  if (photos.length > 0) {
    showRandomPhoto();
  }
}

function showRandomPhoto() {
  let next;

  do {
    next = Math.floor(Math.random() * photos.length);
  } while (photos.length > 1 && next === previous);

  previous = next;

  photo.classList.remove("visible");

  setTimeout(() => {
    photo.onload = () => {
      photo.classList.add("visible");
    };

    photo.src = photos[next];
  }, 500);
}

photo.addEventListener("click", showRandomPhoto);

loadPhotos();

setInterval(() => {
  if (photos.length > 0) {
    showRandomPhoto();
  }
}, 5000);
</script>

</body>
</html>
