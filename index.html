<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: white;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#photo {
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
  cursor: pointer;
  transition: opacity 1s ease;
}
</style>
</head>

<body>

<img id="photo" src="16%20copy.jpg">

<script>
const photos = [
  "16%20copy.jpg",
  "18%20copy.jpg",
  "3%20copy.jpg",
  "5%20copy.jpg",
  "8%20copy.jpg",
  "9%20copy.jpg"
];

let current = 0;

function changePhoto() {
  document.getElementById("photo").style.opacity = "0";

  setTimeout(function() {
    current = (current + 1) % photos.length;
    document.getElementById("photo").src = photos[current];
    document.getElementById("photo").style.opacity = "1";
  }, 1000);
}

setInterval(changePhoto, 5000);

document.getElementById("photo").onclick = changePhoto;
</script>

</body>
</html>
